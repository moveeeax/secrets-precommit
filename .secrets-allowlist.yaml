# Allowlist for THIS repo's own self-scan. A secret scanner is, inevitably, the
# repo most full of "secrets" — every test and fixture is a planted token. This
# file is also a worked example of the three allowlist axes for downstream users.

# Paths allowed to contain secret-shaped strings (globs; matched on full path
# and basename).
paths:
  - "examples/*"
  - "tests/*"

# Well-known placeholder values that should never fire, anywhere.
regexes:
  - "AKIAIOSFODNN7EXAMPLE"
  - "EXAMPLE"

# Rule IDs to disable entirely (none by default).
rules: []
